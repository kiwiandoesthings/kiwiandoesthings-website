<!DOCTYPE html>
<html>
	<head>
    	<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Kiwian's Site!! - Ao3 Proxy</title>
        <link rel="icon" href="/resources/pixian_icon.ico" type="image/x-icon">
        <link rel="stylesheet" href="/styles.css">
	</head>
	<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">
		<div class="container text">
			<div id="navbar">
                <label for="ao3-story-goto-page">Go to chapter: </label>
				<input id="ao3-story-goto-page" min="1" value="1" type="number" style="width: 5ch;">
				<button id="ao3-story-goto-page-submit" class="button text">Go</button>
            </div>
		
			<h1 style="text-align: center;" id="ao3-story-title">Fetching story...</h1>
			<div id="ao3-story-view" class="ao3-text">Story content is loading...</div>
		</div>
		<div style="display: flex; flex-direction: row;">
			<button style="font-size: 32px;" class="text button" id="ao3-story-devance"><- Previous Page</button>
			<button style="font-size: 32px;" class="text button" id="ao3-story-advance">Next Page -></button>
		</div>
		<script src="ao3viewer.js"></script>
	</body>
</html>
